services:
  - type: web
    name: seafood-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/src/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: PAY2S_RETURN_URL
        value: https://fresh-sea.vercel.app/payment/result
      - key: PAY2S_IPN_URL
        value: https://seafood-api.onrender.com/api/v1/payment/pay2s/webhook
      # Các biến sau phải set thủ công trên Render Dashboard (không commit secret vào git)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PAY2S_PARTNER_CODE
        sync: false
      - key: PAY2S_ACCESS_KEY
        sync: false
      - key: PAY2S_SECRET_KEY
        sync: false
    autoDeploy: true
