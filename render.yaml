services:
  - type: web
    name: seafood-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/src/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: PAY2S_RETURN_URL
        value: https://fresh-sea.vercel.app/payment/result
      - key: PAY2S_IPN_URL
        value: https://seafood-api.onrender.com/api/v1/payment/pay2s/webhook
    autoDeploy: true
